# Re-render the god from its published viewing key and deploy the static listener page to Vercel production,
# only when the render changed. What it does, what it costs, how to pause it: docs/auto-publish.md.
# Every deployed render is also stamped in Bitcoin (OpenTimestamps) and kept on the `anchors` branch by the `anchor`
# job; anchor-upgrade.yml turns those pending proofs into Bitcoin-confirmed ones (docs/anchoring.md).
#
# Secrets (set by a person, never by a script): CHOIR_UFVK (the choir's full viewing key), VERCEL_TOKEN.
# Variables (not secret): VERCEL_ORG_ID, VERCEL_PROJECT_ID; optional WATCHER_CACHE_GEN (change it to drop the
# cached watcher wallet). Never add `set -x` to any step or script of this workflow.
name: publish-web

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Deploy even if the live site already serves this render_hash, or a snapshot at a higher height"
        type: boolean
        default: false
      reset_wallet:
        description: "Ignore the cached watcher wallet and sync again from the birthday"
        type: boolean
        default: false

concurrency:
  group: publish-web
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CHOIR_BIRTHDAY: "4502962"
  WATCHER: wallets/watcher

jobs:
  publish:
    runs-on: ubuntu-24.04   # same distro as the voice pins (espeak-ng 1.51, sox 14.4.2) and the codec2 build
    timeout-minutes: 60
    outputs:
      deployed: ${{ steps.handoff.outputs.deployed }}
      statement: ${{ steps.handoff.outputs.statement }}
      proof: ${{ steps.handoff.outputs.proof }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pins and cache keys
        id: pins
        run: |
          scripts/ci_build_tools.sh --key >>"$GITHUB_OUTPUT"
          echo "slug=$(python3 -c "import json; print(json.load(open('config/brand.json'))['slug'])")" >>"$GITHUB_OUTPUT"

      - name: Restore bin/ (devtool-aegis, c2enc, c2dec)
        id: bin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: ${{ steps.pins.outputs.key }}

      - name: Install system packages
        env:
          BUILD: ${{ steps.bin.outputs.cache-hit != 'true' }}
        run: |
          pkgs="espeak-ng sox libsox-fmt-all"
          if [ "$BUILD" = true ]; then pkgs="$pkgs build-essential pkg-config libssl-dev protobuf-compiler cmake"; fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends $pkgs >/dev/null
          dpkg-query -W espeak-ng sox libsox3

      - name: Restore the cargo registry
        if: steps.bin.outputs.cache-hit != 'true'
        id: cargo
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ steps.pins.outputs.key }}

      - name: Build bin/ (cache miss only; as scripts/setup.sh steps 3-4)
        if: steps.bin.outputs.cache-hit != 'true'
        id: build
        run: scripts/ci_build_tools.sh

      - name: Save bin/
        if: steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bin
          key: ${{ steps.pins.outputs.key }}

      - name: Save the cargo registry
        if: steps.build.outcome == 'success' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ steps.pins.outputs.key }}

      - name: Restore the watcher wallet
        if: ${{ !inputs.reset_wallet }}
        id: watcher
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WATCHER }}
          key: watcher-${{ vars.WATCHER_CACHE_GEN || '1' }}-${{ steps.pins.outputs.devtool }}-run${{ github.run_id }}
          restore-keys: watcher-${{ vars.WATCHER_CACHE_GEN || '1' }}-${{ steps.pins.outputs.devtool }}-

      - name: Write the key file
        env:
          CHOIR_UFVK: ${{ secrets.CHOIR_UFVK }}
        run: |
          umask 077
          case "$CHOIR_UFVK" in
            uview*|uvftest*|uvf1*) ;;
            *) echo "::error::secret CHOIR_UFVK is missing or is not a unified full viewing key (docs/auto-publish.md)"; exit 1;;
          esac
          printf '%s\n' "$CHOIR_UFVK" >"$RUNNER_TEMP/choir.key"

      - name: Render from the key (summon, then render at the newest transaction)
        id: render
        timeout-minutes: 20
        run: scripts/ci_render.sh --key-file "$RUNNER_TEMP/choir.key" --birthday "$CHOIR_BIRTHDAY" --wallet "$WATCHER" --out out

      - name: Delete the key file
        if: always()
        run: |
          if [ -e "$RUNNER_TEMP/choir.key" ]; then shred -u "$RUNNER_TEMP/choir.key" || rm -f "$RUNNER_TEMP/choir.key"; fi
          [ ! -e "$RUNNER_TEMP/choir.key" ] && echo "key file deleted"

      - name: Decide whether to save the watcher wallet
        if: steps.render.outcome == 'success'
        id: watcher-save
        env:
          MATCHED: ${{ steps.watcher.outputs.cache-matched-key }}
          TIP: ${{ steps.render.outputs.tip }}
          RECREATED: ${{ steps.render.outputs.recreated }}
        run: |
          # one cache entry per ~5 h (240 blocks) is enough: a restored wallet only has to sync the gap.
          # A wallet re-created from the key (the restored copy failed) is saved at once, so the next run restores it.
          restored=${MATCHED##*-}
          if [ -z "$MATCHED" ] || [ "$RECREATED" = 1 ] || [ $((TIP - restored)) -ge 240 ]; then
            echo "save=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Save the watcher wallet
        if: steps.watcher-save.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.WATCHER }}
          key: watcher-${{ vars.WATCHER_CACHE_GEN || '1' }}-${{ steps.pins.outputs.devtool }}-${{ steps.render.outputs.tip }}

      - name: Compare with the live site
        id: compare
        env:
          SLUG: ${{ steps.pins.outputs.slug }}
          RENDER_HASH: ${{ steps.render.outputs.render_hash }}
          HEIGHT: ${{ steps.render.outputs.height }}
          FORCE: ${{ inputs.force == true }}
        run: |
          site="https://$SLUG.vercel.app"
          live=$(curl -fsS --retry 3 --max-time 20 "$site/out/render_hash?run=$GITHUB_RUN_ID" 2>/dev/null | tr -d '[:space:]' || true)
          live_height=$(curl -fsS --retry 3 --max-time 20 "$site/static.json?run=$GITHUB_RUN_ID" 2>/dev/null \
                        | python3 -c "import json, sys; print(int(json.load(sys.stdin)['as_of_height']))" 2>/dev/null || echo 0)
          echo "live: render_hash ${live:-unreachable} at height $live_height; new: $RENDER_HASH at height $HEIGHT"
          if [ "$FORCE" = true ]; then
            echo "changed=true" >>"$GITHUB_OUTPUT"
          elif [ "$live" = "$RENDER_HASH" ]; then
            echo "::notice title=no new offering::$site already serves render_hash $RENDER_HASH (height $HEIGHT)"
            echo "changed=false" >>"$GITHUB_OUTPUT"
          elif [ "$HEIGHT" -lt "$live_height" ]; then
            # e.g. a manual scripts/publish_web.sh snapshot at the tip: never replace a higher snapshot with a lower one
            echo "::notice title=no new offering::$site is at height $live_height, above the newest transaction ($HEIGHT); not replacing it"
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Install the OpenTimestamps client (hash-pinned wheels, own venv)
        if: steps.compare.outputs.changed == 'true'
        id: otsclient
        continue-on-error: true    # no client = anchor.json ships without a proof; the deploy goes on
        timeout-minutes: 3
        run: scripts/ci_anchor.sh --venv "$RUNNER_TEMP/ots"

      - name: Build the static snapshot (allow-list)
        if: steps.compare.outputs.changed == 'true'
        env:
          ANCHOR_OTS: ${{ steps.otsclient.outputs.ots }}
          CHOIR_UFVK: ${{ secrets.CHOIR_UFVK }}
        # --stamp: anchor.json.ots from the public calendars; a failed stamp is a warning (docs/anchoring.md)
        # --key-file: the key is published as key.txt from 24 Oct (CLAUDE.md section 6, approved by the user 26 Oct);
        # the file lives only for this step, is never echoed, and build_web.sh fails if the key lands anywhere else
        run: |
          umask 077
          k="$RUNNER_TEMP/site.key"
          printf '%s\n' "$CHOIR_UFVK" >"$k"
          rc=0
          scripts/build_web.sh --out out --dist dist --stamp --key-file "$k" --birthday "$CHOIR_BIRTHDAY" >/dev/null || rc=$?
          shred -u "$k" 2>/dev/null || rm -f "$k"
          exit $rc

      - name: Deploy to Vercel production
        if: steps.compare.outputs.changed == 'true'
        id: deploy
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          RENDER_HASH: ${{ steps.render.outputs.render_hash }}
        run: scripts/ci_deploy.sh --dist dist --expect "$RENDER_HASH"

      - name: Hand the statement to the anchor job
        if: steps.deploy.outcome == 'success'
        id: handoff
        run: |
          # a few hundred bytes each: public hashes and an OpenTimestamps proof, nothing private
          {
            echo "deployed=true"
            echo "statement=$(base64 -w0 dist/anchor.json)"
            if [ -f dist/anchor.json.ots ]; then echo "proof=$(base64 -w0 dist/anchor.json.ots)"; else echo "proof="; fi
          } >>"$GITHUB_OUTPUT"
          echo "anchor.json sha256 $(sha256sum dist/anchor.json | cut -c1-64); proof: $([ -f dist/anchor.json.ots ] && echo pending in Bitcoin || echo none, stamp failed)"

      - name: Summary
        if: always()
        env:
          HEIGHT: ${{ steps.render.outputs.height }}
          RENDER_HASH: ${{ steps.render.outputs.render_hash }}
          CHANGED: ${{ steps.compare.outputs.changed }}
          URL: ${{ steps.deploy.outputs.url }}
          SLUG: ${{ steps.pins.outputs.slug }}
        run: |
          {
            echo "| | |"; echo "|---|---|"
            echo "| height | ${HEIGHT:-–} |"
            echo "| render_hash | \`${RENDER_HASH:-–}\` |"
            if [ -n "$URL" ]; then echo "| deployed | $URL → https://$SLUG.vercel.app |"
            elif [ "$CHANGED" = false ]; then echo "| deployed | no new offering |"
            else echo "| deployed | – |"; fi
            if [ -f dist/anchor.json ]; then
              echo "| anchor.json | \`$(sha256sum dist/anchor.json | cut -c1-64)\` |"
              echo "| proof | $([ -f dist/anchor.json.ots ] && echo 'anchor.json.ots (pending until Bitcoin confirms)' || echo 'none: stamp failed, anchor-upgrade stamps it later') |"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  # Persist every deployed statement + proof on the append-only `anchors` branch (a new deploy replaces the site).
  # The only job with write access; it holds no secrets (GITHUB_TOKEN only) and runs no code from the render.
  anchor:
    needs: publish
    if: needs.publish.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add the statement and its proof to the anchors branch
        env:
          STATEMENT: ${{ needs.publish.outputs.statement }}
          PROOF: ${{ needs.publish.outputs.proof }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          d="$RUNNER_TEMP/anchor"; mkdir -p "$d"
          printf '%s' "$STATEMENT" | base64 -d >"$d/anchor.json"
          if [ -n "$PROOF" ]; then printf '%s' "$PROOF" | base64 -d >"$d/anchor.json.ots"; fi
          python3 -m anchor persist "$d/anchor.json"
