<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="mark">
  <!-- The mark: one hollow chamber whose outer contour almost closes but stops short; a fine line enters
       through the gap; a smaller cavity inside. A structure in the act of becoming. No eye, no text.
       Paths and flat fills only; works in one dark or one light colour. -->
  <rect width="256" height="256" rx="28" fill="#171916"/>
  <!-- outer contour, open at the top -->
  <path fill="none" stroke="#E4DFD0" stroke-width="6" stroke-linecap="round"
        d="M150 62 C190 72 198 130 188 172 C178 214 152 232 128 228 C96 223 66 196 66 150 C66 108 86 74 116 60"/>
  <!-- the line that entered through the gap -->
  <path fill="none" stroke="#777F79" stroke-width="2.5" stroke-linecap="round" d="M134 54 C132 70 128 82 126 96"/>
  <!-- inner cavity -->
  <path fill="none" stroke="#777F79" stroke-width="3" stroke-linecap="round"
        d="M128 110 C150 110 162 134 158 158 C154 182 140 198 126 196 C106 192 96 168 100 142 C104 122 114 110 128 110 Z"/>
  <!-- ribs between the membranes -->
  <g stroke="#777F79" stroke-width="2.5" stroke-linecap="round">
    <path d="M78 150 L98 152"/><path d="M82 176 L102 172"/><path d="M92 198 L110 190"/>
    <path d="M176 128 L160 134"/><path d="M182 158 L162 160"/>
  </g>
</svg>
