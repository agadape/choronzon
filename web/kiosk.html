<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kiosk</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  main { max-width: 760px; margin: 0 auto; padding: clamp(24px, 5vh, 48px) clamp(16px, 4vw, 32px) 80px; display: grid; gap: 24px;
         grid-template-columns: minmax(0, 1fr); }   /* an auto track would grow to the statement's longest line */
  main > * { min-width: 0; }
  textarea { width: 100%; min-height: 120px; padding: 12px; resize: vertical; font-size: 15px; }
  pre#privacy { margin: 0; white-space: pre-wrap; border-left: 2px solid var(--ash); padding: 6px 0 6px 16px;
                font: inherit; font-size: 13px; line-height: 1.6; overflow-x: auto; }
  label { display: flex; gap: 10px; align-items: baseline; cursor: pointer; line-height: 1.5; }
  #status { color: var(--ash); min-height: 1.5em; }
  #status.err { color: var(--anomaly); }
  #result { border: 1px solid var(--ash); padding: 16px; display: none; gap: 10px; }
  #result.on { display: grid; }
  #meta { color: var(--ash); font-size: 12.5px; min-height: 1.4em; }
  #txid, #explorer { word-break: break-all; }
  /* the statement is verbatim (fixed indentation), so on narrow screens it scrolls inside its own box */
  @media (max-width: 600px) { pre#privacy { font-size: 11px; white-space: pre; } }
</style>
</head>
<body>
<main>
  <div>
    <h1 id="name"></h1>
    <div id="tagline" class="tagline"></div>
  </div>

  <div>
    <div class="k" style="margin-bottom: 8px">your secret</div>
    <textarea id="text" maxlength="1500" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
              placeholder="type it here. it will be spoken by a ghost voice, not yours."></textarea>
    <div id="meta"></div>
  </div>

  <div class="row">
    <button id="preview">preview the ghost voice</button>
    <span id="status"></span>
  </div>

  <pre id="privacy">loading the statement…</pre>

  <label><input type="checkbox" id="reply"> <span>ask for a whisper back (a one-time address of this kiosk's wallet is
    embedded; anyone holding the public key can write to it while this session is open)</span></label>
  <label><input type="checkbox" id="understood"> <span>I have read this. What I give is public to every key holder,
    forever.</span></label>

  <div class="row">
    <button id="give" class="primary" disabled>give it</button>
  </div>

  <div id="result">
    <div class="k">given</div>
    <div>txid <span id="txid"></span></div>
    <div><a id="explorer" target="_blank" rel="noopener"></a></div>
    <div id="caveat" class="quiet">the explorer shows only that a shielded transaction exists, and it may lag
      a few blocks; the independent proof is <code>bin/devtool-aegis wallet -w wallets/test/V list-tx</code> on a Watcher.</div>
    <div id="eta">the god will hear it in about 1–4 minutes (observed 40–230 s).</div>
    <div id="details" class="quiet"></div>
  </div>
</main>
<script>document.write(`<script src="kiosk.js?v=${Date.now()}"><\/script>`);</script>
</body>
</html>
